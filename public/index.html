<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esingesini Lounge Operations</title>
<style>
:root{--bg:#090806;--panel:#15120d;--panel2:#1d1811;--gold:#d6a63f;--gold2:#f3d17a;--text:#f7f2e7;--muted:#b8ad98;--line:#3d3323;--ok:#76d69c;--bad:#ff827d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#070705,#17120a);color:var(--text);font:14px Inter,system-ui,Segoe UI,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}aside{background:#080705;border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{text-align:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:14px}.brand h3{margin:8px 0 0;font-family:Georgia;color:var(--gold2)}.brand small{color:var(--muted)}.mark{width:150px;height:150px;margin:0 auto;border:3px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font:700 92px Georgia;box-shadow:0 0 28px #8b601f66}nav{display:grid;gap:5px}.nav{background:transparent;border:1px solid transparent;color:#c9c0b0;text-align:left;padding:11px 12px;border-radius:10px}.nav.active,.nav:hover{background:#1c1710;border-color:#4c3e28;color:var(--gold2)}main{padding:24px;min-width:0}header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}h1,h2,h3{font-family:Georgia,serif}h2{margin:0}.muted{color:var(--muted)}.status{border:1px solid #2f6448;color:#9ce2b9;background:#11251a;padding:7px 10px;border-radius:999px}.role{margin-left:8px;color:var(--gold2);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.metric,.panel{background:linear-gradient(180deg,#17130e,#11100c);border:1px solid var(--line);border-radius:15px;padding:16px}.metric span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.metric b{display:block;color:var(--gold2);font:700 24px Georgia;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px;color:var(--muted);min-width:145px;flex:1}input,select,textarea{background:#0c0a07;border:1px solid #4a3d29;color:white;border-radius:9px;padding:10px}input[type=checkbox]{width:auto}.btn{background:linear-gradient(#d7ad54,#ae7d24);color:#120e07;border:0;border-radius:9px;padding:10px 14px;font-weight:800}.btn.secondary{background:#211a10;color:var(--gold2);border:1px solid #55452d}.btn.danger{background:#4a1d18;color:#ffd6d2}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid #2b2419;text-align:left}th{color:var(--gold2);font-size:11px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#231b0d;color:var(--gold2);font-size:10px}.catalogue{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product{border:1px solid var(--line);background:#0f0d09;border-radius:12px;padding:12px}.product h4{margin:0 0 6px}.product .price{color:var(--gold2);font-weight:800;font-size:18px}.product .stock{color:var(--muted);font-size:11px}.cart-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #2b2419}.hidden{display:none!important}.msg{padding:9px 11px;border-radius:9px;margin:10px 0;display:none}.msg.ok{display:block;background:#12301f;color:#a5e8bd}.msg.bad{display:block;background:#351511;color:#ffc0bb}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.inactive{opacity:.55}.warn{color:#ffd178}.small{font-size:11px}
#login{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at top,#241b0b,#060504 60%);display:grid;place-items:center;padding:20px}.login-card{width:min(460px,100%);background:#12100c;border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center}
@media(max-width:950px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.catalogue{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.app{display:block}aside{position:fixed;z-index:5;left:0;right:0;bottom:0;top:auto;height:auto;padding:7px}.brand{display:none}nav{display:flex;overflow:auto}.nav{white-space:nowrap;font-size:12px}main{padding:14px 12px 82px}.metrics{grid-template-columns:1fr 1fr}.catalogue{grid-template-columns:1fr}header .status{display:none}}
</style></head><body>
<div id="login"><div class="login-card"><div class="mark" style="width:180px;height:180px;font-size:110px">E</div><h2>Esingesini Business Command Centre</h2><p class="muted">Authorised staff access only</p><div id="loginMsg" class="msg"></div><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button class="btn" style="width:100%;margin-top:8px" onclick="login()">Sign in</button></div></div>
<div class="app"><aside><div class="brand"><div class="mark">E</div><h3>ESINGESINI LOUNGE</h3><small>BUSINESS COMMAND CENTRE</small></div><nav id="nav"></nav></aside><main><header><div><h2 id="title">Executive Dashboard</h2><div class="muted" id="subtitle">Live operational control</div></div><div><span class="status">● PRODUCTION</span><span class="role" id="roleBadge"></span> <button class="btn secondary" onclick="logout()">Sign out</button></div></header><section id="content"></section></main></div>
<script>
const money=n=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(n||0));
let TOKEN=localStorage.getItem('es_token')||'',user=null,catalogue=[],manageCatalogue=[],cart={};
const api=async(url,opts={})=>{opts.headers={'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{}),...(opts.headers||{})};const r=await fetch(url,opts);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j};
function flash(id,text,ok=true){const n=document.getElementById(id);if(!n)return;n.className='msg '+(ok?'ok':'bad');n.textContent=text}
function can(...roles){return user&&roles.includes(user.role)}
const menu=[['dashboard','Dashboard'],['pos','Point of Sale'],['inventory','Inventory'],['products','Products & Prices'],['receiving','Stock Receiving'],['expenses','Expenses'],['cashup','Cash-Up'],['infrastructure','Off-Grid'],['staff','Staff & Access'],['audit','Audit']];
function buildNav(){nav.innerHTML=menu.filter(([p])=>p!=='staff'||can('DIRECTOR')).filter(([p])=>p!=='products'||can('DIRECTOR','ADMINISTRATOR')).map(([p,n])=>`<button class="nav" data-page="${p}" onclick="show('${p}')">${n}</button>`).join('');roleBadge.textContent=user?user.role:''}
async function login(){try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});TOKEN=r.token;user=r.user;localStorage.setItem('es_token',TOKEN);document.getElementById('login').classList.add('hidden');buildNav();await loadCatalogue();await show('dashboard')}catch(e){flash('loginMsg',e.message,false)}}
function logout(){localStorage.removeItem('es_token');TOKEN='';location.reload()}
async function loadCatalogue(){catalogue=await api('/api/catalogue')}
async function loadManage(){manageCatalogue=await api('/api/catalogue/manage')}
function navActive(p){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}
async function show(p){navActive(p);if(pages[p])await pages[p]()}
const metric=(a,b)=>`<div class="metric"><span>${a}</span><b>${b}</b></div>`,line=(a,b)=>`<div class="cart-line"><span>${a}</span><b>${b}</b></div>`;
const productOptions=list=>list.map(p=>`<option value="${p.sku}">${p.name} · ${p.serving}</option>`).join('');

const pages={
dashboard:async()=>{title.textContent='Executive Dashboard';subtitle.textContent='Actual trading figures from the live database';const d=await api('/api/dashboard');content.innerHTML=`<div class="metrics">${metric('Sales today',money(d.sales))}${metric('Cash',money(d.cash))}${metric('Card',money(d.card))}${metric('EFT',money(d.eft))}${metric('Transactions',d.transactions)}${metric('Expenses',money(d.expenses))}${metric('Stock value',money(d.stock_value))}${metric('Low stock',d.low_stock)}</div><div class="grid"><div class="panel"><h3>Trading Control</h3>${line('Cash sales',money(d.cash))}${line('Card sales',money(d.card))}${line('EFT sales',money(d.eft))}${line('Recorded expenses',money(d.expenses))}</div><div class="panel"><h3>Off-Grid Status</h3>${d.infrastructure?line('Battery',d.infrastructure.battery_percent+'%')+line('Solar',d.infrastructure.solar_kw+' kW')+line('Water',d.infrastructure.water_percent+'%')+line('Internet',d.infrastructure.internet_status||'Not set'):'<p class="muted">No infrastructure reading recorded yet.</p>'}</div></div>`},
pos:async()=>{title.textContent='Point of Sale';subtitle.textContent='Units and event cases · cash, card and EFT';await loadCatalogue();const cats=[...new Set(catalogue.map(x=>x.category))];content.innerHTML=`<div class="grid"><div class="panel"><div class="row"><label>Category<select id="catFilter" onchange="renderProducts()"><option value="">All</option>${cats.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Search<input id="search" oninput="renderProducts()" placeholder="Product name"></label></div><div id="products" class="catalogue" style="margin-top:14px"></div></div><div class="panel"><h3>Current Sale</h3><div id="cart"></div><div class="row" style="margin-top:12px"><label>Payment<select id="pay"><option>CASH</option><option>CARD</option><option>EFT</option></select></label><label>Cash tendered<input id="tender" type="number" min="0" step="0.01"></label></div><button class="btn" style="width:100%;margin-top:12px" onclick="completeSale()">Complete Sale</button><div id="saleMsg" class="msg"></div></div></div>`;renderProducts();renderCart()},
inventory:async()=>{title.textContent='Inventory';subtitle.textContent='Physical stock, cases, cost and reorder visibility';await loadManage();content.innerHTML=`<div class="panel table-wrap"><table><thead><tr><th>SKU</th><th>Category</th><th>Product</th><th>Serving</th><th>Stock Units</th><th>Cases Available</th><th>Unit Cost</th><th>Unit Price</th><th>Case Price</th><th>Reorder</th></tr></thead><tbody>${manageCatalogue.map(p=>`<tr class="${p.active?'':'inactive'}"><td>${p.sku}</td><td>${p.category}</td><td>${p.name}</td><td>${p.serving}</td><td>${p.stock_qty}</td><td>${p.case_size>1?Math.floor(p.stock_qty/p.case_size):'—'}</td><td>${p.unit_cost==null?'—':money(p.unit_cost)}</td><td>${p.selling_price==null?'Not set':money(p.selling_price)}</td><td>${p.case_size>1?(p.case_selling_price==null?'Not set':money(p.case_selling_price)):'—'}</td><td>${p.reorder_level}</td></tr>`).join('')}</tbody></table></div>`},
products:async()=>{if(!can('DIRECTOR','ADMINISTRATOR'))return show('dashboard');title.textContent='Products & Prices';subtitle.textContent='Add items manually, edit POS prices, case sizes and event pricing';await loadManage();content.innerHTML=`<div class="panel"><div class="section-head"><h3>Add New Item</h3><span class="muted">No item is sold until activated with a valid price.</span></div><div class="row"><label>SKU (optional)<input id="nsku" placeholder="Auto-generated if blank"></label><label>Category<input id="ncat" list="cats" placeholder="BEER, FOOD, CIGARETTE..."></label><label>Name<input id="nname"></label><label>Serving / pack<input id="nserv" placeholder="330 ml / 20 pack"></label></div><div class="row" style="margin-top:10px"><label>Unit selling price<input id="nprice" type="number" step="0.01"></label><label>Units per case/carton<input id="ncase" type="number" value="1" min="1"></label><label>Case/carton selling price<input id="ncaseprice" type="number" step="0.01"></label><label>Reorder level<input id="nreorder" type="number" value="0"></label><label>Age restricted<select id="nage"><option value="false">No</option><option value="true">Yes</option></select></label><label>Active on POS<select id="nactive"><option value="false">No</option><option value="true">Yes</option></select></label></div><button class="btn" style="margin-top:12px" onclick="addProduct()">Add Item</button><div id="productMsg" class="msg"></div><datalist id="cats"><option>BEER</option><option>CIDER & RTD</option><option>BRANDY</option><option>WHISKY</option><option>VODKA</option><option>GIN</option><option>RUM</option><option>WINE</option><option>SOFT DRINK</option><option>WATER</option><option>ENERGY DRINK</option><option>FOOD</option><option>CIGARETTE</option><option>OTHER</option></datalist></div><div class="panel table-wrap" style="margin-top:14px"><table><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Unit Price</th><th>Case Size</th><th>Case Price</th><th>Active</th><th></th></tr></thead><tbody>${manageCatalogue.map(p=>`<tr><td>${p.sku}</td><td>${p.name}<div class="muted small">${p.serving}${p.age_restricted?' · Age restricted':''}</div></td><td>${p.category}</td><td><input id="price_${p.sku}" value="${p.selling_price??''}" type="number" step="0.01" style="width:100px"></td><td><input id="case_${p.sku}" value="${p.case_size||1}" type="number" min="1" style="width:80px"></td><td><input id="caseprice_${p.sku}" value="${p.case_selling_price??''}" type="number" step="0.01" style="width:110px"></td><td><input id="active_${p.sku}" type="checkbox" ${p.active?'checked':''}></td><td><button class="btn secondary" onclick="saveProduct('${p.sku}')">Save</button></td></tr>`).join('')}</tbody></table></div>`},
receiving:async()=>{title.textContent='Stock Receiving';subtitle.textContent='Receive individual units or full cases/cartons for events';await loadManage();content.innerHTML=`<div class="panel"><div class="row"><label>Product<select id="rsku">${productOptions(manageCatalogue)}</select></label><label>Receiving mode<select id="rmode"><option value="UNIT">Individual units</option><option value="CASE">Cases / cartons</option></select></label><label>Quantity<input id="rqty" type="number" step="1" min="1"></label><label>Cost per selected unit/case (R)<input id="rcost" type="number" step="0.01" min="0"></label></div><div class="row" style="margin-top:10px"><label>Supplier / invoice reference<input id="rref"></label><label>Note<input id="rnote"></label></div><button class="btn" style="margin-top:12px" onclick="receiveStock()">Receive Stock</button><div id="receiveMsg" class="msg"></div></div>`},
expenses:async()=>{title.textContent='Expenses';subtitle.textContent='Record actual operating expenditure';content.innerHTML=`<div class="panel"><div class="row"><label>Category<select id="ecat"><option>Stock</option><option>Fuel</option><option>Staff</option><option>Security</option><option>Internet</option><option>Maintenance</option><option>Cleaning</option><option>Utilities</option><option>Other</option></select></label><label>Description<input id="edesc"></label><label>Amount<input id="eamt" type="number" min="0" step="0.01"></label><label>Payment<select id="epay"><option>CASH</option><option>CARD</option><option>EFT</option></select></label></div><label style="margin-top:10px">Reference<input id="eref" placeholder="Invoice / receipt number"></label><button class="btn" style="margin-top:12px" onclick="saveExpense()">Record Expense</button><div id="expenseMsg" class="msg"></div></div>`},
cashup:async()=>{title.textContent='Daily Cash-Up';subtitle.textContent='Reconcile till cash against recorded sales and cash expenses';content.innerHTML=`<div class="panel"><div class="row"><label>Business date<input id="cdate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Opening float<input id="cfloat" type="number" value="0" step="0.01"></label><label>Actual cash counted<input id="cactual" type="number" step="0.01"></label></div><label style="margin-top:10px">Notes<textarea id="cnotes"></textarea></label><button class="btn" style="margin-top:12px" onclick="cashup()">Complete Cash-Up</button><div id="cashMsg" class="msg"></div></div>`},
infrastructure:async()=>{title.textContent='Off-Grid Infrastructure';subtitle.textContent='Solar, water and connectivity operating status';content.innerHTML=`<div class="panel"><div class="row"><label>Battery %<input id="ibatt" type="number" min="0" max="100" step="0.1"></label><label>Solar generation kW<input id="isolar" type="number" min="0" step="0.01"></label><label>Water tank %<input id="iwater" type="number" min="0" max="100" step="0.1"></label><label>Internet<select id="inet"><option>ONLINE</option><option>DEGRADED</option><option>OFFLINE</option></select></label></div><label style="margin-top:10px">Note<input id="inote"></label><button class="btn" style="margin-top:12px" onclick="saveInfra()">Save Status</button><div id="infraMsg" class="msg"></div></div>`},
staff:async()=>{if(!can('DIRECTOR'))return show('dashboard');title.textContent='Staff & Access Control';subtitle.textContent='Director-controlled accounts for administrators and operational staff';const rows=await api('/api/staff');content.innerHTML=`<div class="panel"><h3>Create Staff Account</h3><div class="row"><label>Full name<input id="sname"></label><label>Email<input id="semail" type="email"></label><label>Role<select id="srole"><option>ADMINISTRATOR</option><option>MANAGER</option><option>CASHIER</option><option>STOCK</option></select></label><label>Temporary password<input id="spass" type="password" minlength="10"></label></div><button class="btn" style="margin-top:12px" onclick="addStaff()">Create Account</button><div id="staffMsg" class="msg"></div></div><div class="panel table-wrap" style="margin-top:14px"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Created</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><input id="sn_${r.id}" value="${r.full_name||''}" ${r.role==='DIRECTOR'?'disabled':''}></td><td>${r.email}</td><td>${r.role==='DIRECTOR'?'<b>DIRECTOR</b>':`<select id="sr_${r.id}"><option ${r.role==='ADMINISTRATOR'?'selected':''}>ADMINISTRATOR</option><option ${r.role==='MANAGER'?'selected':''}>MANAGER</option><option ${r.role==='CASHIER'?'selected':''}>CASHIER</option><option ${r.role==='STOCK'?'selected':''}>STOCK</option></select>`}</td><td>${r.role==='DIRECTOR'?'Protected':`<input id="sa_${r.id}" type="checkbox" ${r.active?'checked':''}>`}</td><td>${new Date(r.created_at).toLocaleDateString()}</td><td>${r.role==='DIRECTOR'?'':`<button class="btn secondary" onclick="saveStaff(${r.id})">Save</button>`}</td></tr>`).join('')}</tbody></table></div>`},
audit:async()=>{title.textContent='Audit Trail';subtitle.textContent='Management activity history';const rows=await api('/api/audit');content.innerHTML=`<div class="panel table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>ID</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString()}</td><td>${r.actor}</td><td>${r.action}</td><td>${r.entity}</td><td>${r.entity_id||''}</td></tr>`).join('')}</tbody></table></div>`}
};

function renderProducts(){const cat=document.getElementById('catFilter')?.value||'',q=(document.getElementById('search')?.value||'').toLowerCase();const list=catalogue.filter(p=>(!cat||p.category===cat)&&(!q||p.name.toLowerCase().includes(q)));products.innerHTML=list.map(p=>`<div class="product"><span class="pill">${p.category}</span><h4>${p.name}</h4><div class="stock">${p.serving} · Stock: ${p.stock_qty}</div><div class="price">${money(p.selling_price)}</div><button class="btn secondary" onclick="addCart('${p.sku}')" ${p.stock_qty<=0?'disabled':''}>Add Unit</button>${p.case_size>1&&p.case_selling_price>0?` <button class="btn secondary" onclick="sellCase('${p.sku}')" ${p.stock_qty<p.case_size?'disabled':''}>Sell Case ${money(p.case_selling_price)}</button>`:''}</div>`).join('')}
function addCart(sku){cart[sku]=(cart[sku]||0)+1;renderCart()}function removeCart(sku){if(--cart[sku]<=0)delete cart[sku];renderCart()}
function renderCart(){const c=document.getElementById('cart');if(!c)return;const arr=Object.entries(cart);if(!arr.length){c.innerHTML='<p class="muted">No items added.</p>';return}let total=0;c.innerHTML=arr.map(([sku,qty])=>{const p=catalogue.find(x=>x.sku===sku),t=p.selling_price*qty;total+=t;return `<div class="cart-line"><span>${p.name} × ${qty}</span><span>${money(t)} <button class="btn secondary" onclick="removeCart('${sku}')">−</button></span></div>`}).join('')+`<div class="cart-line"><b>TOTAL</b><b>${money(total)}</b></div>`}
async function completeSale(){try{const items=Object.entries(cart).map(([sku,qty])=>({sku,qty}));if(!items.length)throw new Error('Add at least one item');const r=await api('/api/sales',{method:'POST',body:JSON.stringify({items,payment_method:pay.value,cash_tendered:pay.value==='CASH'?Number(tender.value):null})});cart={};flash('saleMsg',`Sale complete · ${r.receipt_no} · ${money(r.total)}${r.change_due!=null?' · Change '+money(r.change_due):''}`);await loadCatalogue();renderProducts();renderCart()}catch(e){flash('saleMsg',e.message,false)}}
async function sellCase(sku){try{const method=pay.value;const tendered=method==='CASH'?Number(tender.value):null;const r=await api('/api/sales/case',{method:'POST',body:JSON.stringify({sku,qty:1,payment_method:method,cash_tendered:tendered})});flash('saleMsg',`Case sale complete · ${r.receipt_no} · ${money(r.total)}${r.change_due!=null?' · Change '+money(r.change_due):''}`);await loadCatalogue();renderProducts()}catch(e){flash('saleMsg',e.message,false)}}
async function addProduct(){try{await api('/api/products/manage',{method:'POST',body:JSON.stringify({sku:nsku.value,category:ncat.value,name:nname.value,serving:nserv.value,selling_price:nprice.value,case_size:Number(ncase.value||1),case_selling_price:ncaseprice.value,reorder_level:Number(nreorder.value||0),age_restricted:nage.value==='true',active:nactive.value==='true'})});flash('productMsg','Item added successfully');await pages.products()}catch(e){flash('productMsg',e.message,false)}}
async function saveProduct(sku){try{await api('/api/products/manage/'+encodeURIComponent(sku),{method:'PATCH',body:JSON.stringify({selling_price:document.getElementById('price_'+sku).value,case_size:Number(document.getElementById('case_'+sku).value||1),case_selling_price:document.getElementById('caseprice_'+sku).value,active:document.getElementById('active_'+sku).checked})});await loadCatalogue();await pages.products()}catch(e){alert(e.message)}}
async function receiveStock(){try{if(rmode.value==='CASE'){const r=await api('/api/stock/receive-case',{method:'POST',body:JSON.stringify({sku:rsku.value,qty:Number(rqty.value),case_cost:Number(rcost.value),reference:rref.value,note:rnote.value})});flash('receiveMsg',`Cases received · ${r.units_added} stock units added`)}else{await api('/api/stock/receive',{method:'POST',body:JSON.stringify({sku:rsku.value,qty:Number(rqty.value),unit_cost:Number(rcost.value),reference:rref.value,note:rnote.value})});flash('receiveMsg','Stock received successfully')}await loadCatalogue()}catch(e){flash('receiveMsg',e.message,false)}}
async function addStaff(){try{await api('/api/staff',{method:'POST',body:JSON.stringify({full_name:sname.value,email:semail.value,role:srole.value,password:spass.value})});await pages.staff()}catch(e){flash('staffMsg',e.message,false)}}
async function saveStaff(id){try{await api('/api/staff/'+id,{method:'PATCH',body:JSON.stringify({full_name:document.getElementById('sn_'+id).value,role:document.getElementById('sr_'+id).value,active:document.getElementById('sa_'+id).checked})});await pages.staff()}catch(e){alert(e.message)}}
async function saveExpense(){try{await api('/api/expenses',{method:'POST',body:JSON.stringify({category:ecat.value,description:edesc.value,amount:Number(eamt.value),payment_method:epay.value,reference:eref.value})});flash('expenseMsg','Expense recorded')}catch(e){flash('expenseMsg',e.message,false)}}
async function cashup(){try{const r=await api('/api/cashups',{method:'POST',body:JSON.stringify({business_date:cdate.value,opening_float:Number(cfloat.value),actual_cash:Number(cactual.value),notes:cnotes.value})});flash('cashMsg',`Cash-up saved · Expected ${money(r.cashup.expected_cash)} · Variance ${money(r.cashup.variance)}`)}catch(e){flash('cashMsg',e.message,false)}}
async function saveInfra(){try{await api('/api/infrastructure',{method:'POST',body:JSON.stringify({battery_percent:ibatt.value,solar_kw:isolar.value,water_percent:iwater.value,internet_status:inet.value,note:inote.value})});flash('infraMsg','Infrastructure status updated')}catch(e){flash('infraMsg',e.message,false)}}

(async()=>{if(TOKEN){try{const me=await api('/api/me');user=me.user;document.getElementById('login').classList.add('hidden');buildNav();await loadCatalogue();await show('dashboard')}catch(e){localStorage.removeItem('es_token');location.reload()}}})();
</script></body></html>

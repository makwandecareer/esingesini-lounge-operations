<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Esingesini Lounge Business Command Centre</title>
<style>
:root{--bg:#080705;--panel:#15120d;--panel2:#0f0d09;--gold:#d6a63f;--gold2:#f3d17a;--text:#f8f3e8;--muted:#b7ad99;--line:#3d3323;--green:#7ee0a6;--red:#ff8d85}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#080705,#17120b);color:var(--text);font:14px Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}aside{background:#070604;border-right:1px solid var(--line);padding:18px;height:100vh;position:sticky;top:0;overflow:auto}.brand{text-align:center;border-bottom:1px solid var(--line);padding-bottom:16px}.mark{width:148px;height:148px;margin:auto;border:3px solid var(--gold);border-radius:50%;display:grid;place-items:center;font:700 90px Georgia;color:var(--gold2);box-shadow:0 0 30px #8e621d66}.brand h3{color:var(--gold2);font-family:Georgia;margin:8px 0 2px}.brand small{color:var(--muted)}nav{display:grid;gap:4px;margin-top:14px}.section{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#74664d;margin:14px 10px 4px}.nav{border:1px solid transparent;background:transparent;color:#d4cbbb;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer}.nav:hover,.nav.active{background:#1c1710;border-color:#4b3d28;color:var(--gold2)}.director-only,.management-only{display:none!important}body.is-director .director-only{display:block!important}body.is-management .management-only{display:block!important}main{padding:24px;min-width:0}header{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}h2,h3{font-family:Georgia,serif}h2{margin:0}.muted{color:var(--muted)}.role,.status{padding:7px 10px;border-radius:999px}.role{border:1px solid #715824;background:#21190d;color:var(--gold2)}.status{border:1px solid #2a6648;background:#10261a;color:#9be4b9}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric,.panel{background:linear-gradient(180deg,#17130e,#11100c);border:1px solid var(--line);border-radius:15px;padding:16px}.metric span{display:block;text-transform:uppercase;font-size:11px;color:var(--muted)}.metric b{display:block;font:700 24px Georgia;color:var(--gold2);margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px;color:var(--muted);min-width:150px;flex:1}input,select,textarea{width:100%;background:#0b0907;border:1px solid #4b3e2a;color:#fff;border-radius:9px;padding:10px}textarea{min-height:84px}.btn{background:linear-gradient(#d9ad52,#ae7a23);color:#130e07;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.secondary{background:#211a10;color:var(--gold2);border:1px solid #55442c}.btn.danger{background:#531e19;color:#ffd6d3;border:1px solid #763128}.btn:disabled{opacity:.4;cursor:not-allowed}.warning{background:#2c210e;border:1px solid #6c5424;color:#f3d17a;padding:10px;border-radius:10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:9px;border-bottom:1px solid #2b2419;text-align:left;vertical-align:middle}th{font-size:11px;color:var(--gold2)}.catalogue{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product{border:1px solid var(--line);border-radius:12px;background:#0f0d09;padding:12px}.product h4{margin:4px 0}.price{font-size:18px;font-weight:800;color:var(--gold2)}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#241c0e;color:var(--gold2);font-size:10px}.cart-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #2b2419}.msg{display:none;padding:9px 11px;border-radius:9px;margin-top:10px}.msg.ok{display:block;background:#12301f;color:#a7e9bf}.msg.bad{display:block;background:#351511;color:#ffc1bc}.hidden{display:none!important}#login,#passwordGate{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at top,#241b0b,#060504 60%);display:grid;place-items:center;padding:20px}.login-card{width:min(500px,100%);background:#12100c;border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center}.login-card label{text-align:left;margin:10px 0}.staff-grid,.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.credentials{background:#0d1e14;border:1px solid #2f6448;border-radius:12px;padding:14px;margin-top:12px}.credentials code{color:#b7f3cf;font-size:16px;word-break:break-all}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}.catalogue{grid-template-columns:repeat(2,1fr)}.staff-grid,.three{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{display:block}aside{position:fixed;z-index:6;left:0;right:0;bottom:0;top:auto;height:auto;padding:7px}.brand,.section{display:none}nav{display:flex;overflow:auto}.nav{white-space:nowrap}main{padding:14px 12px 86px}.grid,.two{grid-template-columns:1fr}.catalogue,.staff-grid,.three{grid-template-columns:1fr}.status{display:none}}
</style></head><body>
<div id="login"><div class="login-card"><div class="mark" style="width:180px;height:180px;font-size:110px">E</div><h2>Esingesini Business Command Centre</h2><p class="muted">Authorised staff only</p><div id="loginMsg" class="msg"></div><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button class="btn" style="width:100%;margin-top:8px" onclick="loginUser()">Sign in</button></div></div>
<div id="passwordGate" class="hidden"><div class="login-card"><h2>Secure Your Account</h2><p class="muted">Create your private password before continuing.</p><div id="passwordMsg" class="msg"></div><label>Current password<input id="currentPw" type="password"></label><label>New password<input id="newPw" type="password"></label><label>Confirm password<input id="confirmPw" type="password"></label><button class="btn" onclick="changeOwnPassword()">Change Password</button></div></div>
<div class="app"><aside><div class="brand"><div class="mark">E</div><h3>ESINGESINI LOUNGE</h3><small>BUSINESS COMMAND CENTRE</small></div><nav>
<div class="section">Operations</div><button class="nav active" data-page="dashboard">Dashboard</button><button class="nav" data-page="pos">Point of Sale</button><button class="nav" data-page="inventory">Inventory</button><button class="nav management-only" data-page="receiving">Stock Receiving</button><button class="nav management-only" data-page="billing">Capitec & Cash Billing</button><button class="nav management-only" data-page="suppliers">Suppliers</button><button class="nav management-only" data-page="purchaseorders">Purchase Orders</button><button class="nav management-only" data-page="stockcounts">Stock Counts</button><button class="nav management-only" data-page="events">Events & Functions</button><button class="nav management-only" data-page="reports">Reports</button><button class="nav management-only" data-page="alerts">Alerts</button>
<div class="section director-only">Director Control</div><button class="nav director-only" data-page="director">Director Control Centre</button><button class="nav director-only" data-page="products">Products & Prices</button><button class="nav director-only" data-page="staff">Staff Registration & Access</button><button class="nav director-only" data-page="administration">Administration Management</button><button class="nav director-only" data-page="openingstock">Opening Stock</button><button class="nav director-only" data-page="settings">Business Settings</button>
<div class="section">Business Control</div><button class="nav management-only" data-page="expenses">Expenses</button><button class="nav management-only" data-page="cashup">Cash-Up</button><button class="nav management-only" data-page="infrastructure">Off-Grid</button><button class="nav management-only" data-page="recentSales">Sales Control</button><button class="nav management-only" data-page="audit">Audit Trail</button>
</nav></aside><main><header><div><h2 id="title">Executive Dashboard</h2><div id="subtitle" class="muted">Live operational control</div></div><div><span id="roleBadge" class="role"></span> <span class="status">● PRODUCTION</span> <button class="btn secondary" onclick="logout()">Sign out</button></div></header><section id="content"></section></main></div>
<script>
const money=n=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(n||0));let TOKEN=localStorage.getItem('es_token')||'',user=null,catalogue=[],cart={};const DIRECTOR_EMAIL='makwandegcora23@gmail.com';const isDirector=()=>user&&user.role==='DIRECTOR'&&user.email.toLowerCase()===DIRECTOR_EMAIL;const isManagement=()=>user&&['DIRECTOR','MANAGING_DIRECTOR','ADMINISTRATOR','MANAGER'].includes(user.role);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const api=async(url,opts={})=>{opts.headers={'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{}),...(opts.headers||{})};const r=await fetch(url,opts),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j};function flash(id,text,ok=true){const n=document.getElementById(id);if(!n)return;n.className='msg '+(ok?'ok':'bad');n.textContent=text}function applyRole(){document.body.classList.toggle('is-director',isDirector());document.body.classList.toggle('is-management',isManagement());roleBadge.textContent=user?.role||''}async function loadCatalogue(all=false){catalogue=await api('/api/catalogue'+(all&&isDirector()?'?all=1':''))}
async function loginUser(){try{const entered=password.value,r=await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:entered})});TOKEN=r.token;user=r.user;localStorage.setItem('es_token',TOKEN);applyRole();login.classList.add('hidden');if(user.must_change_password){currentPw.value=entered;passwordGate.classList.remove('hidden');return}await loadCatalogue();show('dashboard')}catch(e){flash('loginMsg',e.message,false)}}async function changeOwnPassword(){try{if(newPw.value!==confirmPw.value)throw new Error('Passwords do not match');await api('/api/change-password',{method:'POST',body:JSON.stringify({current_password:currentPw.value,new_password:newPw.value})});passwordGate.classList.add('hidden');await show('dashboard')}catch(e){flash('passwordMsg',e.message,false)}}function logout(){localStorage.removeItem('es_token');location.reload()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>show(b.dataset.page));function navActive(p){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}async function show(p){if(['director','products','staff','administration','openingstock','settings'].includes(p)&&!isDirector())return;if(['receiving','billing','suppliers','purchaseorders','stockcounts','events','reports','alerts','expenses','cashup','infrastructure','recentSales','audit'].includes(p)&&!isManagement())return;navActive(p);try{await pages[p]()}catch(e){content.innerHTML=`<div class="msg bad" style="display:block">${esc(e.message)}</div>`}}
const metric=(a,b)=>`<div class="metric"><span>${a}</span><b>${b}</b></div>`;const line=(a,b)=>`<div class="cart-line"><span>${a}</span><b>${b}</b></div>`;
const pages={
dashboard:async()=>{title.textContent='Executive Dashboard';subtitle.textContent='Live trading, stock and operating position';const d=await api('/api/dashboard');content.innerHTML=`<div class="metrics">${metric('Sales Today',money(d.sales))}${metric('Cash',money(d.cash))}${metric('Card',money(d.card))}${metric('EFT',money(d.eft))}${metric('Transactions',d.transactions)}${metric('Expenses',money(d.expenses))}${metric('Stock Value',money(d.stock_value))}${metric('Low Stock',d.low_stock)}${metric('Upcoming Events',d.upcoming_events)}${metric('Event Balances',money(d.event_balance))}</div>`},
director:async()=>{title.textContent='Director Control Centre';subtitle.textContent='Executive exceptions and approvals requiring Director attention';const d=await api('/api/director-dashboard');content.innerHTML=`<div class="metrics">${metric('Active Staff',d.active_staff)}${metric('Unresolved Settlements',d.unresolved)}${metric('Cash Variance 7d',money(d.cash_variance))}${metric('Stock Issues',d.stock_issues)}${metric('Stock Unit Variance',d.unit_variance)}${metric('Unpaid Events',d.unpaid_events)}${metric('Outstanding Events',money(d.outstanding))}</div><div class="warning">Use this page as your daily Director exception dashboard. Review unresolved cash, stock, merchant and event issues before close of business.</div>`},
pos:async()=>{title.textContent='Point of Sale';subtitle.textContent='Cash, card and EFT with automatic stock deduction';await loadCatalogue();const cats=[...new Set(catalogue.map(x=>x.category))];content.innerHTML=`<div class="grid"><div class="panel"><div class="row"><label>Category<select id="catFilter" onchange="renderProducts()"><option value="">All</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label>Search<input id="search" oninput="renderProducts()"></label></div><div id="products" class="catalogue" style="margin-top:14px"></div></div><div class="panel"><h3>Current Sale</h3><div id="cart"></div><div class="row"><label>Payment<select id="pay"><option>CASH</option><option>CARD</option><option>EFT</option></select></label><label>Cash tendered<input id="tender" type="number" step="0.01"></label><label class="management-only">Discount R<input id="discount" type="number" step="0.01" value="0"></label><label>Table / Tab Ref<input id="tableRef" placeholder="Optional"></label></div><button class="btn" style="width:100%;margin-top:12px" onclick="completeSale()">Complete Sale</button><div id="saleMsg" class="msg"></div></div></div>`;renderProducts();renderCart()},
inventory:async()=>{title.textContent='Inventory';subtitle.textContent='Stock by exact product size and case format';await loadCatalogue(isDirector());content.innerHTML=`<div class="panel table-wrap"><table><thead><tr><th>SKU</th><th>Category</th><th>Product</th><th>Size</th><th>Stock</th><th>Cases</th><th>Cost</th><th>Unit Price</th><th>Case Price</th><th>Reorder</th></tr></thead><tbody>${catalogue.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.category)}</td><td>${esc(p.name)}</td><td>${esc(p.size_label||p.serving)}</td><td>${p.stock_qty}</td><td>${p.units_per_case>1?Math.floor(p.stock_qty/p.units_per_case):'—'}</td><td>${p.unit_cost==null?'—':money(p.unit_cost)}</td><td>${money(p.selling_price)}</td><td>${p.case_price==null?'—':money(p.case_price)}</td><td>${p.reorder_level}</td></tr>`).join('')}</tbody></table></div>`},
receiving:async()=>{title.textContent='Stock Receiving';subtitle.textContent='Record deliveries using real supplier invoices';await loadCatalogue();content.innerHTML=`<div class="panel"><div class="row"><label>Product<select id="rsku">${catalogue.map(p=>`<option value="${p.sku}">${esc(p.name)} · ${esc(p.size_label||p.serving)}</option>`).join('')}</select></label><label>Mode<select id="rmode"><option>UNIT</option><option>CASE</option></select></label><label>Quantity<input id="rqty" type="number"></label><label>Cost per selected mode<input id="rcost" type="number" step="0.01"></label></div><div class="row"><label>Invoice / Reference<input id="rref"></label><label>Note<input id="rnote"></label></div><button class="btn" onclick="receiveStock()">Receive Stock</button><div id="receiveMsg" class="msg"></div></div>`},
billing:async()=>{title.textContent='Capitec & Cash Billing';subtitle.textContent='Merchant reconciliation and cash banking';content.innerHTML=`<div class="panel"><div class="row"><label>Business date<input id="bdate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><button class="btn" onclick="loadBilling()">Load Billing</button></div></div><div id="billingBody"></div>`;await loadBilling()},
suppliers:async()=>{title.textContent='Supplier Management';subtitle.textContent='Approved supplier register and commercial details';const rows=await api('/api/suppliers');content.innerHTML=`<div class="panel"><h3>Add Supplier</h3><div class="three"><label>Name<input id="sname"></label><label>Contact<input id="scontact"></label><label>Phone<input id="sphone"></label><label>Email<input id="semail"></label><label>Payment Terms<input id="sterms"></label><label>Tax / VAT No.<input id="stax"></label></div><label>Address<textarea id="saddress"></textarea></label><button class="btn" onclick="addSupplier()">Add Supplier</button><div id="supplierMsg" class="msg"></div></div><div class="panel table-wrap"><table><thead><tr><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th>Terms</th><th>Status</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.contact_person||'')}</td><td>${esc(s.phone||'')}</td><td>${esc(s.email||'')}</td><td>${esc(s.payment_terms||'')}</td><td>${s.active?'ACTIVE':'INACTIVE'}</td></tr>`).join('')}</tbody></table></div>`},
purchaseorders:async()=>{title.textContent='Purchase Orders';subtitle.textContent='Formal procurement approval and receiving';const [sup,po]=await Promise.all([api('/api/suppliers'),api('/api/purchase-orders')]);await loadCatalogue();content.innerHTML=`<div class="panel"><h3>Create Purchase Order</h3><div class="row"><label>Supplier<select id="posupplier"><option value="">Unspecified</option>${sup.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>Product<select id="posku">${catalogue.map(p=>`<option value="${p.sku}">${esc(p.name)} · ${esc(p.size_label||p.serving)}</option>`).join('')}</select></label><label>Mode<select id="pomode"><option>UNIT</option><option>CASE</option></select></label><label>Qty<input id="poqty" type="number"></label><label>Cost<input id="pocost" type="number" step="0.01"></label></div><button class="btn" onclick="createPO()">Create PO</button><div id="poMsg" class="msg"></div></div><div class="panel table-wrap"><table><thead><tr><th>PO</th><th>Supplier</th><th>Date</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>${po.map(p=>`<tr><td>${esc(p.po_no)}</td><td>${esc(p.supplier_name||'—')}</td><td>${String(p.order_date).slice(0,10)}</td><td>${money(p.total)}</td><td>${esc(p.status)}</td><td>${p.status==='DRAFT'&&isDirector()?`<button class="btn" onclick="approvePO(${p.id})">Approve</button>`:''} ${['APPROVED','PART_RECEIVED'].includes(p.status)?`<button class="btn secondary" onclick="receivePO(${p.id})">Receive</button>`:''}</td></tr>`).join('')}</tbody></table></div>`},
stockcounts:async()=>{title.textContent='Stock Counts & Variance';subtitle.textContent='Physical stock control and shrinkage management';const rows=await api('/api/stock-counts');content.innerHTML=`<div class="panel"><div class="row"><label>Business date<input id="scdate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Notes<input id="scnote"></label><button class="btn" onclick="startStockCount()">Start Count</button></div></div><div class="panel table-wrap"><table><thead><tr><th>Count</th><th>Date</th><th>Status</th><th>Created By</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.count_no)}</td><td>${String(r.business_date).slice(0,10)}</td><td>${esc(r.status)}</td><td>${esc(r.created_by)}</td><td>${r.status==='OPEN'?`<button class="btn secondary" onclick="openCount(${r.id})">Enter Count</button>${isDirector()?` <button class="btn" onclick="closeCount(${r.id})">Close & Apply</button>`:''}`:''}</td></tr>`).join('')}</tbody></table></div><div id="countEditor"></div>`},
events:async()=>{title.textContent='Events & Functions';subtitle.textContent='Imigidi, weddings, parties and private functions';const rows=await api('/api/events');content.innerHTML=`<div class="panel"><h3>Register Event</h3><div class="three"><label>Type<select id="etype"><option>IMIGIDI</option><option>WEDDING</option><option>BIRTHDAY</option><option>PRIVATE FUNCTION</option><option>OTHER</option></select></label><label>Event Name<input id="ename"></label><label>Date<input id="edate" type="date"></label><label>Client<input id="eclient"></label><label>Phone<input id="ephone"></label><label>Guests<input id="eguests" type="number"></label><label>Total Amount<input id="etotal" type="number" step="0.01"></label><label>Deposit<input id="edeposit" type="number" step="0.01" value="0"></label><label>Venue<input id="evenue"></label></div><button class="btn" onclick="addEvent()">Register Event</button></div><div class="panel table-wrap"><table><thead><tr><th>Event</th><th>Type</th><th>Date</th><th>Client</th><th>Guests</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th>Payment</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${esc(e.event_name)}</td><td>${esc(e.event_type)}</td><td>${String(e.event_date).slice(0,10)}</td><td>${esc(e.client_name||'')}</td><td>${e.guest_count||''}</td><td>${money(e.total_amount)}</td><td>${money(e.deposit_amount)}</td><td>${money(e.balance)}</td><td>${esc(e.status)}</td><td>${e.balance>0?`<button class="btn secondary" onclick="payEvent(${e.id})">Record Payment</button>`:''}</td></tr>`).join('')}</tbody></table></div>`},
reports:async()=>{title.textContent='Management Reports';subtitle.textContent='Revenue, margin, expenses and product performance';content.innerHTML=`<div class="panel"><div class="row"><label>From<input id="repFrom" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>To<input id="repTo" type="date" value="${new Date().toISOString().slice(0,10)}"></label><button class="btn" onclick="loadReport()">Run Report</button></div></div><div id="reportBody"></div>`;await loadReport()},
alerts:async()=>{title.textContent='Operational Alerts';subtitle.textContent='Exceptions requiring management action';const a=await api('/api/alerts');content.innerHTML=`<div class="grid"><div class="panel"><h3>Low Stock</h3>${a.low_stock.length?a.low_stock.map(x=>line(`${esc(x.name)} ${esc(x.size_label||'')}`,`${x.qty} / reorder ${x.reorder_level}`)).join(''):'<p class="muted">No low-stock exceptions.</p>'}</div><div class="panel"><h3>Cash Variances</h3>${a.cash_variances.length?a.cash_variances.map(x=>line(String(x.business_date).slice(0,10),money(x.variance))).join(''):'<p class="muted">No cash variances.</p>'}</div><div class="panel"><h3>Unpaid Events</h3>${a.unpaid_events.length?a.unpaid_events.map(x=>line(`${esc(x.event_name)} · ${String(x.event_date).slice(0,10)}`,money(x.balance))).join(''):'<p class="muted">No unpaid upcoming events.</p>'}</div></div>`},
products:async()=>{title.textContent='Products & Prices';subtitle.textContent='DIRECTOR ONLY — control catalogue, sizes and prices';await loadCatalogue(true);content.innerHTML=`<div class="warning">Selling prices, sizes, case configuration and catalogue status are Director-controlled.</div><div class="panel"><div class="row"><label>SKU<input id="nsku"></label><label>Category<input id="ncat"></label><label>Product<input id="nname"></label><label>Size<input id="nsize"></label><label>Unit Price<input id="nprice" type="number" step="0.01"></label><label>Units/Case<input id="ncaseunits" type="number" value="1"></label><label>Case Price<input id="ncaseprice" type="number" step="0.01"></label><label>Reorder<input id="nreorder" type="number" value="0"></label></div><button class="btn" onclick="addProduct()">Add Product / Size</button></div><div class="panel table-wrap"><table><thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Size</th><th>Unit Price</th><th>Units/Case</th><th>Case Price</th><th>Reorder</th><th>Active</th><th>Action</th></tr></thead><tbody>${catalogue.map(p=>`<tr><td>${esc(p.sku)}</td><td><input id="name-${p.sku}" value="${esc(p.name)}"></td><td><input id="cat-${p.sku}" value="${esc(p.category)}"></td><td><input id="size-${p.sku}" value="${esc(p.size_label||p.serving)}"></td><td><input id="price-${p.sku}" type="number" value="${p.selling_price}"></td><td><input id="uc-${p.sku}" type="number" value="${p.units_per_case||1}"></td><td><input id="cp-${p.sku}" type="number" value="${p.case_price??''}"></td><td><input id="ro-${p.sku}" type="number" value="${p.reorder_level||0}"></td><td><select id="active-${p.sku}"><option value="true" ${p.active?'selected':''}>Active</option><option value="false" ${!p.active?'selected':''}>Archived</option></select></td><td><button class="btn" onclick="saveProduct('${p.sku}')">Save</button> <button class="btn danger" onclick="removeProduct('${p.sku}')">Remove</button></td></tr>`).join('')}</tbody></table></div>`},
staff:async()=>{title.textContent='Staff Registration & Access';subtitle.textContent='DIRECTOR ONLY — formally register and control every login';const rows=await api('/api/users');content.innerHTML=`<div class="warning">Staff cannot self-register. The Director appoints staff and controls access.</div><div class="panel"><div class="staff-grid"><label>Full Name<input id="ufull"></label><label>Employee No.<input id="uemp"></label><label>Email<input id="uemail"></label><label>Phone<input id="uphone"></label><label>Job Title<input id="utitle"></label><label>Department<input id="udept" value="Operations"></label><label>Start Date<input id="uhire" type="date"></label><label>Role<select id="urole"><option>MANAGING_DIRECTOR</option><option>ADMINISTRATOR</option><option>MANAGER</option><option>CASHIER</option><option>STOCK</option></select></label></div><button class="btn" onclick="addUser()">Register Staff & Create Login</button><div id="staffMsg" class="msg"></div><div id="credentialBox"></div></div><div class="panel table-wrap"><table><thead><tr><th>Employee</th><th>Name</th><th>Email</th><th>Role</th><th>Job</th><th>Status</th><th>Last Login</th><th>Action</th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.employee_no||'—')}</td><td>${esc(u.full_name||'—')}</td><td>${esc(u.email)}</td><td><select id="ur-${u.id}" ${u.role==='DIRECTOR'?'disabled':''}>${['DIRECTOR','MANAGING_DIRECTOR','ADMINISTRATOR','MANAGER','CASHIER','STOCK'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></td><td>${esc(u.job_title||'—')}</td><td><select id="ua-${u.id}" ${u.role==='DIRECTOR'?'disabled':''}><option value="true" ${u.active?'selected':''}>Active</option><option value="false" ${!u.active?'selected':''}>Disabled</option></select></td><td>${u.last_login_at?new Date(u.last_login_at).toLocaleString():'Never'}</td><td>${u.role!=='DIRECTOR'?`<button class="btn secondary" onclick="resetStaff(${u.id})">Reset Password</button> `:''}<button class="btn" onclick="saveUser(${u.id})">Save</button></td></tr>`).join('')}</tbody></table></div>`},
administration:async()=>{title.textContent='Administration Management';subtitle.textContent='DIRECTOR ONLY — management hierarchy';const d=await api('/api/administration');content.innerHTML=`<div class="warning">The Director is the highest authority. Managing Director, Administrator and Manager powers are delegated below the Director.</div><div class="metrics">${d.summary.map(x=>metric(x.role,x.active+' active / '+x.total)).join('')}</div>`},
openingstock:async()=>{title.textContent='Opening Stock Capture';subtitle.textContent='DIRECTOR ONLY — establish real opening quantities';await loadCatalogue(true);content.innerHTML=`<div class="warning">Use this once during setup or after a formally approved reset. Enter physical quantities actually on hand.</div><div class="panel table-wrap"><table><thead><tr><th>SKU</th><th>Product</th><th>Size</th><th>Opening Qty</th><th>Actual Unit Cost</th></tr></thead><tbody>${catalogue.filter(p=>p.active).map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td>${esc(p.size_label||p.serving)}</td><td><input class="oqty" data-sku="${p.sku}" type="number" value="${p.stock_qty}"></td><td><input class="ocost" data-sku="${p.sku}" type="number" step="0.01" value="${p.unit_cost??''}"></td></tr>`).join('')}</tbody></table><button class="btn" onclick="saveOpeningStock()">Save Opening Stock</button></div>`},
settings:async()=>{title.textContent='Business Settings';subtitle.textContent='DIRECTOR ONLY — system-wide business configuration';const rows=await api('/api/settings');const map=Object.fromEntries(rows.map(x=>[x.setting_key,x.setting_value]));content.innerHTML=`<div class="panel"><div class="two"><label>Business Name<input id="setName" value="${esc(map.business_name||'Esingesini Lounge')}"></label><label>Receipt Footer<input id="setReceipt" value="${esc(map.receipt_footer||'Thank you for supporting Esingesini Lounge')}"></label><label>Operating Hours<input id="setHours" value="${esc(map.operating_hours||'')}"></label><label>VAT Status<input id="setVat" value="${esc(map.vat_status||'Not configured')}"></label></div><button class="btn" onclick="saveSettings()">Save Settings</button></div>`},
expenses:async()=>{title.textContent='Expenses';subtitle.textContent='Record actual operating expenditure';content.innerHTML=`<div class="panel"><div class="row"><label>Category<select id="ecat"><option>Stock</option><option>Fuel</option><option>Staff</option><option>Security</option><option>Internet</option><option>Maintenance</option><option>Cleaning</option><option>Utilities</option><option>Other</option></select></label><label>Description<input id="edesc"></label><label>Amount<input id="eamt" type="number" step="0.01"></label><label>Payment<select id="epay"><option>CASH</option><option>CARD</option><option>EFT</option></select></label><label>Reference<input id="eref"></label></div><button class="btn" onclick="saveExpense()">Record Expense</button><div id="expenseMsg" class="msg"></div></div>`},
cashup:async()=>{title.textContent='Daily Cash-Up';subtitle.textContent='Reconcile till cash against recorded activity';content.innerHTML=`<div class="panel"><div class="row"><label>Date<input id="cdate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Opening Float<input id="cfloat" type="number" value="0"></label><label>Actual Cash Counted<input id="cactual" type="number"></label></div><label>Notes<textarea id="cnotes"></textarea></label><button class="btn" onclick="cashup()">Complete Cash-Up</button><div id="cashMsg" class="msg"></div></div>`},
infrastructure:async()=>{title.textContent='Off-Grid Infrastructure';subtitle.textContent='Solar, water and connectivity status';content.innerHTML=`<div class="panel"><div class="row"><label>Battery %<input id="ibatt" type="number"></label><label>Solar kW<input id="isolar" type="number"></label><label>Water %<input id="iwater" type="number"></label><label>Internet<select id="inet"><option>ONLINE</option><option>DEGRADED</option><option>OFFLINE</option></select></label></div><label>Note<input id="inote"></label><button class="btn" onclick="saveInfra()">Save Status</button></div>`},
recentSales:async()=>{title.textContent='Sales Control';subtitle.textContent='Recent receipts, void control and audit';const rows=await api('/api/sales/recent');content.innerHTML=`<div class="panel table-wrap"><table><thead><tr><th>Receipt</th><th>Time</th><th>Payment</th><th>Total</th><th>Status</th><th>Actor</th><th>Control</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.receipt_no)}</td><td>${new Date(s.created_at).toLocaleString()}</td><td>${esc(s.payment_method)}</td><td>${money(s.total)}</td><td>${esc(s.status)}</td><td>${esc(s.actor)}</td><td>${s.status==='COMPLETED'?`<button class="btn danger" onclick="voidSale(${s.id})">Void</button>`:''}</td></tr>`).join('')}</tbody></table></div>`},
audit:async()=>{title.textContent='Audit Trail';subtitle.textContent='Management activity history';const rows=await api('/api/audit');content.innerHTML=`<div class="panel table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>ID</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString()}</td><td>${esc(r.actor)}</td><td>${esc(r.action)}</td><td>${esc(r.entity)}</td><td>${esc(r.entity_id||'')}</td></tr>`).join('')}</tbody></table></div>`}
};
function renderProducts(){const cat=catFilter?.value||'',q=(search?.value||'').toLowerCase();products.innerHTML=catalogue.filter(p=>(!cat||p.category===cat)&&(!q||(p.name+' '+(p.size_label||p.serving)).toLowerCase().includes(q))).map(p=>`<div class="product"><span class="pill">${esc(p.category)}</span><h4>${esc(p.name)}</h4><div class="muted">${esc(p.size_label||p.serving)} · Stock ${p.stock_qty}</div><div class="price">${money(p.selling_price)}</div><button class="btn secondary" ${p.stock_qty<=0?'disabled':''} onclick="addCart('${p.sku}','UNIT')">Unit</button>${p.units_per_case>1?` <button class="btn secondary" ${p.stock_qty<p.units_per_case?'disabled':''} onclick="addCart('${p.sku}','CASE')">Case ${p.case_price!=null?money(p.case_price):''}</button>`:''}</div>`).join('')}
function addCart(sku,mode){const k=sku+'|'+mode;cart[k]=(cart[k]||0)+1;renderCart()}function removeCart(k){if(--cart[k]<=0)delete cart[k];renderCart()}function renderCart(){const c=document.getElementById('cart');if(!c)return;let total=0;c.innerHTML=Object.entries(cart).length?Object.entries(cart).map(([k,q])=>{const [sku,mode]=k.split('|'),p=catalogue.find(x=>x.sku===sku),price=mode==='CASE'?(p.case_price??p.selling_price*p.units_per_case):p.selling_price,t=price*q;total+=t;return `<div class="cart-line"><span>${esc(p.name)} ${esc(p.size_label||'')} · ${mode} × ${q}</span><span>${money(t)} <button class="btn secondary" onclick="removeCart('${k}')">−</button></span></div>`}).join('')+`<div class="cart-line"><b>TOTAL</b><b>${money(total)}</b></div>`:'<p class="muted">No items added.</p>'}
async function completeSale(){try{const items=Object.entries(cart).map(([k,qty])=>{const [sku,mode]=k.split('|');return{sku,mode,qty}});const r=await api('/api/sales',{method:'POST',body:JSON.stringify({items,payment_method:pay.value,cash_tendered:pay.value==='CASH'?Number(tender.value):null,discount_amount:isManagement()?Number(discount?.value||0):0,table_ref:tableRef.value})});cart={};flash('saleMsg',`Sale complete · ${r.receipt_no} · ${money(r.total)}${r.change_due!=null?' · Change '+money(r.change_due):''}`);await loadCatalogue();renderProducts();renderCart()}catch(e){flash('saleMsg',e.message,false)}}
async function receiveStock(){try{await api('/api/stock/receive',{method:'POST',body:JSON.stringify({sku:rsku.value,mode:rmode.value,qty:Number(rqty.value),unit_cost:Number(rcost.value),reference:rref.value,note:rnote.value})});flash('receiveMsg','Stock received');await loadCatalogue()}catch(e){flash('receiveMsg',e.message,false)}}
async function loadBilling(){const d=await api('/api/billing?date='+bdate.value);billingBody.innerHTML=`<div class="metrics">${metric('Total Sales',money(d.total_sales))}${metric('Cash',money(d.cash_sales))}${metric('Card',money(d.card_sales))}${metric('EFT',money(d.eft_sales))}${metric('Cash Banked',money(d.cash_banked))}${metric('Card Settled',money(d.capitec_card_net))}${metric('Card Outstanding',money(d.unsettled_card))}${metric('Cash Available',money(d.cash_available))}</div><div class="panel"><div class="row"><label>Channel<select id="mchannel"><option value="CAPITEC_CARD">Capitec Card</option><option value="CAPITEC_EFT">Capitec EFT</option><option value="CASH_BANKING">Cash Banking</option></select></label><label>Gross<input id="mgross" type="number"></label><label>Fees<input id="mfees" type="number" value="0"></label><label>Reference<input id="mref"></label><label>Status<select id="mstatus"><option>PENDING</option><option>SETTLED</option><option>RECONCILED</option></select></label></div><button class="btn" onclick="recordSettlement()">Record Settlement</button></div>`}
async function recordSettlement(){await api('/api/merchant-settlements',{method:'POST',body:JSON.stringify({business_date:bdate.value,channel:mchannel.value,gross_amount:Number(mgross.value),fees:Number(mfees.value),reference:mref.value,status:mstatus.value})});await loadBilling()}
async function addSupplier(){try{await api('/api/suppliers',{method:'POST',body:JSON.stringify({name:sname.value,contact_person:scontact.value,phone:sphone.value,email:semail.value,payment_terms:sterms.value,tax_no:stax.value,address:saddress.value})});await pages.suppliers()}catch(e){flash('supplierMsg',e.message,false)}}
async function createPO(){try{await api('/api/purchase-orders',{method:'POST',body:JSON.stringify({supplier_id:posupplier.value||null,items:[{sku:posku.value,mode:pomode.value,qty:Number(poqty.value),unit_cost:Number(pocost.value)}]})});await pages.purchaseorders()}catch(e){flash('poMsg',e.message,false)}}async function approvePO(id){await api('/api/purchase-orders/'+id+'/approve',{method:'POST'});await pages.purchaseorders()}async function receivePO(id){await api('/api/purchase-orders/'+id+'/receive',{method:'POST'});await pages.purchaseorders()}
async function startStockCount(){await api('/api/stock-counts',{method:'POST',body:JSON.stringify({business_date:scdate.value,notes:scnote.value})});await pages.stockcounts()}async function openCount(id){const items=await api('/api/stock-counts/'+id+'/items');countEditor.innerHTML=`<div class="panel table-wrap"><h3>Physical Count</h3><table><thead><tr><th>SKU</th><th>Product</th><th>System</th><th>Physical</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.sku)}</td><td>${esc(i.name)} ${esc(i.size_label||'')}</td><td>${i.system_qty}</td><td><input class="phys" data-sku="${i.sku}" type="number" value="${i.physical_qty??''}"></td></tr>`).join('')}</tbody></table><button class="btn" onclick="saveCount(${id})">Save Count</button></div>`}async function saveCount(id){const items=[...document.querySelectorAll('.phys')].map(x=>({sku:x.dataset.sku,physical_qty:Number(x.value)}));await api('/api/stock-counts/'+id+'/items',{method:'PUT',body:JSON.stringify({items})});alert('Count saved')}async function closeCount(id){await api('/api/stock-counts/'+id+'/close',{method:'POST'});await pages.stockcounts()}
async function addEvent(){await api('/api/events',{method:'POST',body:JSON.stringify({event_type:etype.value,event_name:ename.value,event_date:edate.value,client_name:eclient.value,client_phone:ephone.value,guest_count:Number(eguests.value||0),total_amount:Number(etotal.value||0),deposit_amount:Number(edeposit.value||0),venue:evenue.value})});await pages.events()}async function payEvent(id){const amount=prompt('Payment amount (R)');if(!amount)return;const method=prompt('Payment method: CASH, CARD or EFT','CASH');await api('/api/events/'+id+'/payment',{method:'POST',body:JSON.stringify({amount:Number(amount),payment_method:method})});await pages.events()}
async function loadReport(){const d=await api(`/api/reports/summary?from=${repFrom.value}&to=${repTo.value}`);reportBody.innerHTML=`<div class="metrics">${metric('Revenue',money(d.revenue))}${metric('COGS',money(d.cogs))}${metric('Gross Profit',money(d.gross_profit))}${metric('Expenses',money(d.expenses))}${metric('Net Operating Result',money(d.net_operating_result))}</div><div class="panel"><h3>Top Products</h3>${d.top_products.map(x=>line(`${esc(x.name)} ${esc(x.size_label||'')}`,`${x.qty} units · ${money(x.sales)}`)).join('')}</div>`}
async function addProduct(){await api('/api/products',{method:'POST',body:JSON.stringify({sku:nsku.value,category:ncat.value,name:nname.value,size_label:nsize.value,selling_price:Number(nprice.value),units_per_case:Number(ncaseunits.value),case_price:ncaseprice.value,reorder_level:Number(nreorder.value)})});await pages.products()}async function saveProduct(sku){await api('/api/products/'+encodeURIComponent(sku),{method:'PUT',body:JSON.stringify({name:document.getElementById('name-'+sku).value,category:document.getElementById('cat-'+sku).value,size_label:document.getElementById('size-'+sku).value,selling_price:Number(document.getElementById('price-'+sku).value),units_per_case:Number(document.getElementById('uc-'+sku).value),case_price:document.getElementById('cp-'+sku).value,reorder_level:Number(document.getElementById('ro-'+sku).value),active:document.getElementById('active-'+sku).value==='true'})});await pages.products()}async function removeProduct(sku){if(confirm('Remove from active sale?')){await api('/api/products/'+encodeURIComponent(sku),{method:'DELETE'});await pages.products()}}
async function addUser(){try{const r=await api('/api/users',{method:'POST',body:JSON.stringify({full_name:ufull.value,employee_no:uemp.value,email:uemail.value,phone:uphone.value,job_title:utitle.value,department:udept.value,hire_date:uhire.value,role:urole.value})});credentialBox.innerHTML=`<div class="credentials"><b>Login created</b><br>Email: <code>${esc(r.user.email)}</code><br>Temporary password: <code>${esc(r.temporary_password)}</code><br><span class="muted">Give this directly to the employee. They must change it at first login.</span></div>`;await pages.staff()}catch(e){flash('staffMsg',e.message,false)}}async function saveUser(id){await api('/api/users/'+id,{method:'PUT',body:JSON.stringify({role:document.getElementById('ur-'+id).value,active:document.getElementById('ua-'+id).value==='true'})});await pages.staff()}async function resetStaff(id){const r=await api('/api/users/'+id,{method:'PUT',body:JSON.stringify({generate_password:true})});alert('Temporary password: '+r.temporary_password)}
async function saveOpeningStock(){const qty=[...document.querySelectorAll('.oqty')],cost=[...document.querySelectorAll('.ocost')];const cm=Object.fromEntries(cost.map(x=>[x.dataset.sku,x.value]));const items=qty.map(x=>({sku:x.dataset.sku,qty:Number(x.value),unit_cost:cm[x.dataset.sku]===''?null:Number(cm[x.dataset.sku])}));if(confirm('Save these quantities as physical opening stock?')){await api('/api/stock/opening',{method:'POST',body:JSON.stringify({items})});alert('Opening stock saved');await pages.inventory()}}
async function saveSettings(){for(const [k,v] of [['business_name',setName.value],['receipt_footer',setReceipt.value],['operating_hours',setHours.value],['vat_status',setVat.value]])await api('/api/settings/'+k,{method:'PUT',body:JSON.stringify({value:v})});alert('Settings saved')}
async function saveExpense(){try{await api('/api/expenses',{method:'POST',body:JSON.stringify({category:ecat.value,description:edesc.value,amount:Number(eamt.value),payment_method:epay.value,reference:eref.value})});flash('expenseMsg','Expense recorded')}catch(e){flash('expenseMsg',e.message,false)}}async function cashup(){try{const r=await api('/api/cashups',{method:'POST',body:JSON.stringify({business_date:cdate.value,opening_float:Number(cfloat.value),actual_cash:Number(cactual.value),notes:cnotes.value})});flash('cashMsg',`Cash-up saved · Variance ${money(r.variance)}`)}catch(e){flash('cashMsg',e.message,false)}}async function saveInfra(){await api('/api/infrastructure',{method:'POST',body:JSON.stringify({battery_percent:ibatt.value,solar_kw:isolar.value,water_percent:iwater.value,internet_status:inet.value,note:inote.value})});alert('Infrastructure status saved')}async function voidSale(id){const reason=prompt('Reason for void');if(reason==null)return;await api('/api/sales/'+id+'/void',{method:'POST',body:JSON.stringify({reason})});await pages.recentSales()}
(async()=>{if(TOKEN){try{user=await api('/api/me');applyRole();login.classList.add('hidden');await loadCatalogue();show('dashboard')}catch(e){localStorage.removeItem('es_token');location.reload()}}})();
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esingesini Lounge Operations</title>
<style>
:root{--bg:#090806;--panel:#15120d;--gold:#d6a63f;--gold2:#f3d17a;--text:#f7f2e7;--muted:#b8ad98;--line:#3d3323;--ok:#76d69c;--bad:#ff827d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#070705,#17120a);color:var(--text);font:14px Inter,system-ui,Segoe UI,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}aside{background:#080705;border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{text-align:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:14px}.brandmark{width:150px;height:150px;margin:0 auto;border:3px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font:700 92px Georgia;box-shadow:0 0 28px #8b601f66}.brand h3{margin:8px 0 0;font-family:Georgia;color:var(--gold2)}.brand small{color:var(--muted)}nav{display:grid;gap:5px}.nav{background:transparent;border:1px solid transparent;color:#c9c0b0;text-align:left;padding:11px 12px;border-radius:10px;width:100%}.nav.active,.nav:hover{background:#1c1710;border-color:#4c3e28;color:var(--gold2)}.nav-section{margin:12px 10px 4px;color:#75664c;font-size:10px;text-transform:uppercase;letter-spacing:.12em}main{padding:24px;min-width:0}header{display:flex;justify-content:space-between;gap:16px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}h2,h3{font-family:Georgia,serif}h2{margin:0}.muted{color:var(--muted)}.status{border:1px solid #2f6448;color:#9ce2b9;background:#11251a;padding:7px 10px;border-radius:999px}.role{border:1px solid #6e5524;color:var(--gold2);background:#21190d;padding:7px 10px;border-radius:999px;margin-right:6px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.metric,.panel{background:linear-gradient(180deg,#17130e,#11100c);border:1px solid var(--line);border-radius:15px;padding:16px}.metric span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.metric b{display:block;color:var(--gold2);font:700 24px Georgia;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px;color:var(--muted);min-width:150px;flex:1}input,select,textarea{background:#0c0a07;border:1px solid #4a3d29;color:white;border-radius:9px;padding:10px}textarea{min-height:80px}.btn{background:linear-gradient(#d7ad54,#ae7d24);color:#120e07;border:0;border-radius:9px;padding:10px 14px;font-weight:800}.btn.secondary{background:#211a10;color:var(--gold2);border:1px solid #55452d}.btn.danger{background:#521e18;color:#ffd6d2;border:1px solid #793029}.btn:disabled{opacity:.4;cursor:not-allowed}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px;border-bottom:1px solid #2b2419;text-align:left;vertical-align:middle}th{color:var(--gold2);font-size:11px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#231b0d;color:var(--gold2);font-size:10px}.catalogue{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product{border:1px solid var(--line);background:#0f0d09;border-radius:12px;padding:12px}.product h4{margin:0 0 6px}.product .price{color:var(--gold2);font-weight:800;font-size:18px}.product .stock{color:var(--muted);font-size:11px}.cart-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #2b2419}.hidden{display:none!important}.msg{padding:9px 11px;border-radius:9px;margin:10px 0;display:none}.msg.ok{display:block;background:#12301f;color:#a5e8bd}.msg.bad{display:block;background:#351511;color:#ffc0bb}.warning{background:#2d210e;border:1px solid #6e5524;color:#f3d17a;padding:10px;border-radius:10px}.director-only{display:none!important}.management-only{display:none!important}body.is-director .director-only{display:block!important}body.is-director tr.director-only{display:table-row!important}body.is-management .management-only{display:block!important}#login{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at top,#241b0b,#060504 60%);display:grid;place-items:center;padding:20px}.login-card{width:min(460px,100%);background:#12100c;border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center}.login-card label{text-align:left;margin:10px 0}
@media(max-width:950px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.catalogue{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.app{display:block}aside{position:fixed;z-index:5;left:0;right:0;bottom:0;top:auto;height:auto;padding:7px}.brand,.nav-section{display:none}nav{display:flex;overflow:auto}.nav{white-space:nowrap;font-size:12px;width:auto}main{padding:14px 12px 82px}.metrics{grid-template-columns:1fr 1fr}.catalogue{grid-template-columns:1fr}header .status{display:none}}
</style></head><body>
<div id="login"><div class="login-card"><div class="brandmark" style="width:180px;height:180px;font-size:110px">E</div><h2>Esingesini Business Command Centre</h2><p class="muted">Authorised staff access only</p><div id="loginMsg" class="msg"></div><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button class="btn" style="width:100%;margin-top:8px" onclick="login()">Sign in</button></div></div>
<div class="app"><aside><div class="brand"><div class="brandmark">E</div><h3>ESINGESINI LOUNGE</h3><small>BUSINESS COMMAND CENTRE</small></div><nav>
<div class="nav-section">Operations</div>
<button class="nav active" data-page="dashboard">Dashboard</button><button class="nav" data-page="pos">Point of Sale</button><button class="nav" data-page="inventory">Inventory</button><button class="nav" data-page="receiving">Stock Receiving</button><button class="nav management-only" data-page="billing">Capitec & Cash Billing</button>
<div class="nav-section director-only">Director Control</div>
<button class="nav director-only" data-page="products">Products & Prices</button><button class="nav director-only" data-page="staff">Staff & Access</button>
<div class="nav-section">Business Control</div>
<button class="nav" data-page="expenses">Expenses</button><button class="nav" data-page="cashup">Cash-Up</button><button class="nav" data-page="infrastructure">Off-Grid</button><button class="nav" data-page="audit">Audit</button>
</nav></aside><main><header><div><h2 id="title">Executive Dashboard</h2><div class="muted" id="subtitle">Live operational control</div></div><div><span id="roleBadge" class="role"></span><span class="status">● PRODUCTION</span> <button class="btn secondary" onclick="logout()">Sign out</button></div></header><section id="content"></section></main></div>
<script>
const money=n=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(n||0));
let TOKEN=localStorage.getItem('es_token')||'',user=null,catalogue=[],cart={};
const isDirector=()=>user&&['DIRECTOR','OWNER'].includes(user.role);
const isManagement=()=>user&&['DIRECTOR','OWNER','ADMINISTRATOR','MANAGER'].includes(user.role);
const api=async(url,opts={})=>{opts.headers={'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{}),...(opts.headers||{})};const r=await fetch(url,opts);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j};
function flash(id,text,ok=true){const n=document.getElementById(id);if(!n)return;n.className='msg '+(ok?'ok':'bad');n.textContent=text}
function applyRole(){document.body.classList.toggle('is-director',isDirector());document.body.classList.toggle('is-management',isManagement());roleBadge.textContent=user?.role||''}
async function login(){try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});TOKEN=r.token;user=r.user;localStorage.setItem('es_token',TOKEN);applyRole();document.getElementById('login').classList.add('hidden');await loadCatalogue();show('dashboard')}catch(e){flash('loginMsg',e.message,false)}}
function logout(){localStorage.removeItem('es_token');TOKEN='';location.reload()}
async function loadCatalogue(all=false){catalogue=await api('/api/catalogue'+(all&&isDirector()?'?all=1':''))}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>show(b.dataset.page));
function navActive(p){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}
async function show(p){if((p==='products'||p==='staff')&&!isDirector())return;if(p==='billing'&&!isManagement())return;navActive(p);if(pages[p])await pages[p]()}
const metric=(a,b)=>`<div class="metric"><span>${a}</span><b>${b}</b></div>`;const line=(a,b)=>`<div class="cart-line"><span>${a}</span><b>${b}</b></div>`;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

const pages={
dashboard:async()=>{title.textContent='Executive Dashboard';subtitle.textContent='Actual trading figures from the live database';const d=await api('/api/dashboard');content.innerHTML=`<div class="metrics">${metric('Sales today',money(d.sales))}${metric('Cash',money(d.cash))}${metric('Card',money(d.card))}${metric('EFT',money(d.eft))}${metric('Transactions',d.transactions)}${metric('Expenses',money(d.expenses))}${metric('Stock value',money(d.stock_value))}${metric('Low stock',d.low_stock)}</div><div class="grid"><div class="panel"><h3>Trading Control</h3>${line('Cash sales',money(d.cash))}${line('Card sales',money(d.card))}${line('EFT sales',money(d.eft))}${line('Recorded expenses',money(d.expenses))}</div><div class="panel"><h3>Off-Grid Status</h3>${d.infrastructure?line('Battery',(d.infrastructure.battery_percent??'—')+'%')+line('Solar',(d.infrastructure.solar_kw??'—')+' kW')+line('Water',(d.infrastructure.water_percent??'—')+'%')+line('Internet',d.infrastructure.internet_status||'Not set'):'<p class="muted">No infrastructure reading recorded yet.</p>'}</div></div>`},
pos:async()=>{title.textContent='Point of Sale';subtitle.textContent='Cash, card and EFT with automatic stock deduction';await loadCatalogue();const cats=[...new Set(catalogue.map(x=>x.category))];content.innerHTML=`<div class="grid"><div class="panel"><div class="row"><label>Category<select id="catFilter" onchange="renderProducts()"><option value="">All</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label>Search<input id="search" oninput="renderProducts()" placeholder="Product name or size"></label></div><div id="products" class="catalogue" style="margin-top:14px"></div></div><div class="panel"><h3>Current Sale</h3><div id="cart"></div><div class="row" style="margin-top:12px"><label>Payment<select id="pay"><option>CASH</option><option>CARD</option><option>EFT</option></select></label><label>Cash tendered<input id="tender" type="number" min="0" step="0.01"></label></div><button class="btn" style="width:100%;margin-top:12px" onclick="completeSale()">Complete Sale</button><div id="saleMsg" class="msg"></div></div></div>`;renderProducts();renderCart()},
inventory:async()=>{title.textContent='Inventory';subtitle.textContent='Stock by exact product size and pack format';await loadCatalogue(isDirector());content.innerHTML=`<div class="panel table-wrap"><table><thead><tr><th>SKU</th><th>Category</th><th>Product</th><th>Size</th><th>Stock Units</th><th>Cases Available</th><th>Cost</th><th>Unit Price</th><th>Case Price</th><th>Reorder</th><th>Status</th></tr></thead><tbody>${catalogue.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.category)}</td><td>${esc(p.name)}</td><td>${esc(p.size_label||p.serving)}</td><td>${p.stock_qty}</td><td>${p.units_per_case>1?Math.floor(p.stock_qty/p.units_per_case):'—'}</td><td>${p.unit_cost==null?'—':money(p.unit_cost)}</td><td>${money(p.selling_price)}</td><td>${p.case_price==null?'—':money(p.case_price)}</td><td>${p.reorder_level}</td><td>${p.active?'ACTIVE':'ARCHIVED'}</td></tr>`).join('')}</tbody></table></div>`},
receiving:async()=>{title.textContent='Stock Receiving';subtitle.textContent='Receive individual units or full cases/cartons';await loadCatalogue();content.innerHTML=`<div class="panel"><div class="row"><label>Product<select id="rsku">${catalogue.map(p=>`<option value="${p.sku}">${esc(p.name)} · ${esc(p.size_label||p.serving)} · ${p.units_per_case} per case</option>`).join('')}</select></label><label>Receive as<select id="rmode"><option value="UNIT">Individual units</option><option value="CASE">Cases / cartons</option></select></label><label>Quantity<input id="rqty" type="number" step="1" min="0"></label><label>Cost per selected unit/case (R)<input id="rcost" type="number" step="0.01" min="0"></label></div><div class="row" style="margin-top:10px"><label>Supplier / invoice reference<input id="rref"></label><label>Note<input id="rnote"></label></div><button class="btn" style="margin-top:12px" onclick="receiveStock()">Receive Stock</button><div id="receiveMsg" class="msg"></div></div>`},
billing:async()=>{title.textContent='Capitec & Cash Billing';subtitle.textContent='Merchant settlement, cash banking and daily revenue reconciliation';const today=new Date().toISOString().slice(0,10);content.innerHTML=`<div class="panel"><div class="row"><label>Business date<input id="bdate" type="date" value="${today}"></label><button class="btn" onclick="loadBilling()">Load Billing</button></div></div><div id="billingBody"></div>`;await loadBilling()},
products:async()=>{title.textContent='Products & Prices';subtitle.textContent='DIRECTOR ONLY — add, edit, archive, restore and price every size';await loadCatalogue(true);content.innerHTML=`<div class="warning">Only the Director can change selling prices, case prices, product sizes, add products or remove them from sale. Each size is controlled as its own SKU for accurate stock and pricing.</div><div class="panel" style="margin-top:14px"><h3>Add New Product / Size</h3><div class="row"><label>SKU<input id="nsku" placeholder="e.g. COKE-2L"></label><label>Category<input id="ncat" placeholder="SOFT DRINK"></label><label>Brand / Product<input id="nname" placeholder="Coca-Cola"></label><label>Size<input id="nsize" placeholder="2 L"></label></div><div class="row" style="margin-top:10px"><label>Unit selling price (R)<input id="nprice" type="number" step="0.01"></label><label>Units per case/carton<input id="ncaseunits" type="number" value="1" min="1"></label><label>Case/carton selling price (R)<input id="ncaseprice" type="number" step="0.01"></label><label>Reorder level<input id="nreorder" type="number" value="0" min="0"></label><label>Age restricted<select id="nage"><option value="false">No</option><option value="true">Yes</option></select></label></div><button class="btn" style="margin-top:12px" onclick="addProduct()">Add Product / Size</button><div id="productMsg" class="msg"></div></div><div class="panel table-wrap"><table><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Size</th><th>Unit Price</th><th>Units/Case</th><th>Case Price</th><th>Reorder</th><th>Age Restricted</th><th>Active</th><th>Director Actions</th></tr></thead><tbody>${catalogue.map(p=>`<tr id="pr-${esc(p.sku)}"><td>${esc(p.sku)}</td><td><input id="name-${p.sku}" value="${esc(p.name)}"></td><td><input id="cat-${p.sku}" value="${esc(p.category)}"></td><td><input id="size-${p.sku}" value="${esc(p.size_label||p.serving)}"></td><td><input id="price-${p.sku}" type="number" step="0.01" value="${p.selling_price}"></td><td><input id="uc-${p.sku}" type="number" min="1" value="${p.units_per_case||1}"></td><td><input id="cp-${p.sku}" type="number" step="0.01" value="${p.case_price??''}"></td><td><input id="ro-${p.sku}" type="number" min="0" value="${p.reorder_level||0}"></td><td><select id="age-${p.sku}"><option value="false" ${!p.age_restricted?'selected':''}>No</option><option value="true" ${p.age_restricted?'selected':''}>Yes</option></select></td><td><select id="active-${p.sku}"><option value="true" ${p.active?'selected':''}>Active</option><option value="false" ${!p.active?'selected':''}>Archived</option></select></td><td><button class="btn" onclick="saveProduct('${p.sku}')">Save</button> <button class="btn danger" onclick="removeProduct('${p.sku}')">Remove</button></td></tr>`).join('')}</tbody></table></div>`},
staff:async()=>{title.textContent='Staff & Access';subtitle.textContent='DIRECTOR ONLY — appoint and control administrators and operational staff';const rows=await api('/api/users');content.innerHTML=`<div class="warning"><b>Director Control:</b> Your Director account is protected. This page is visible only to the Director. Create qualified administrators here and decide exactly which staff accounts remain active.</div><div class="metrics">${metric('Total staff',rows.length)}${metric('Administrators',rows.filter(x=>x.role==='ADMINISTRATOR').length)}${metric('Active accounts',rows.filter(x=>x.active).length)}${metric('Director','Protected')}</div><div class="panel"><h3>Add Staff Account</h3><div class="row"><label>Email<input id="uemail" type="email"></label><label>Temporary password<input id="upass" type="password"></label><label>Role<select id="urole"><option>ADMINISTRATOR</option><option>MANAGER</option><option>CASHIER</option><option>STOCK</option></select></label></div><button class="btn" style="margin-top:12px" onclick="addUser()">Create Staff Account</button><div id="staffMsg" class="msg"></div></div><div class="panel table-wrap"><h3>Staff Accounts</h3><table><thead><tr><th>Email</th><th>Role</th><th>Active</th><th>New Password</th><th>Director Action</th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.email)}</td><td><select id="ur-${u.id}" ${u.role==='DIRECTOR'?'disabled':''}><option ${u.role==='DIRECTOR'?'selected':''}>DIRECTOR</option><option ${u.role==='ADMINISTRATOR'?'selected':''}>ADMINISTRATOR</option><option ${u.role==='MANAGER'?'selected':''}>MANAGER</option><option ${u.role==='CASHIER'?'selected':''}>CASHIER</option><option ${u.role==='STOCK'?'selected':''}>STOCK</option></select></td><td><select id="ua-${u.id}" ${u.role==='DIRECTOR'?'disabled':''}><option value="true" ${u.active?'selected':''}>Active</option><option value="false" ${!u.active?'selected':''}>Disabled</option></select></td><td><input id="up-${u.id}" type="password" placeholder="Leave blank"></td><td><button class="btn" onclick="saveUser(${u.id})">Save Staff</button></td></tr>`).join('')}</tbody></table></div>`},
expenses:async()=>{title.textContent='Expenses';subtitle.textContent='Record actual operating expenditure';content.innerHTML=`<div class="panel"><div class="row"><label>Category<select id="ecat"><option>Stock</option><option>Fuel</option><option>Staff</option><option>Security</option><option>Internet</option><option>Maintenance</option><option>Cleaning</option><option>Utilities</option><option>Other</option></select></label><label>Description<input id="edesc"></label><label>Amount<input id="eamt" type="number" min="0" step="0.01"></label><label>Payment<select id="epay"><option>CASH</option><option>CARD</option><option>EFT</option></select></label></div><label style="margin-top:10px">Reference<input id="eref"></label><button class="btn" style="margin-top:12px" onclick="saveExpense()">Record Expense</button><div id="expenseMsg" class="msg"></div></div>`},
cashup:async()=>{title.textContent='Daily Cash-Up';subtitle.textContent='Reconcile till cash against recorded sales and cash expenses';content.innerHTML=`<div class="panel"><div class="row"><label>Business date<input id="cdate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Opening float<input id="cfloat" type="number" value="0" step="0.01"></label><label>Actual cash counted<input id="cactual" type="number" step="0.01"></label></div><label style="margin-top:10px">Notes<textarea id="cnotes"></textarea></label><button class="btn" style="margin-top:12px" onclick="cashup()">Complete Cash-Up</button><div id="cashMsg" class="msg"></div></div>`},
infrastructure:async()=>{title.textContent='Off-Grid Infrastructure';subtitle.textContent='Solar, water and connectivity operating status';content.innerHTML=`<div class="panel"><div class="row"><label>Battery %<input id="ibatt" type="number" min="0" max="100"></label><label>Solar generation kW<input id="isolar" type="number" min="0" step="0.01"></label><label>Water tank %<input id="iwater" type="number" min="0" max="100"></label><label>Internet<select id="inet"><option>ONLINE</option><option>DEGRADED</option><option>OFFLINE</option></select></label></div><label style="margin-top:10px">Note<input id="inote"></label><button class="btn" style="margin-top:12px" onclick="saveInfra()">Save Status</button><div id="infraMsg" class="msg"></div></div>`},
audit:async()=>{title.textContent='Audit Trail';subtitle.textContent='Management activity history';const rows=await api('/api/audit');content.innerHTML=`<div class="panel table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>ID</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString()}</td><td>${esc(r.actor)}</td><td>${esc(r.action)}</td><td>${esc(r.entity)}</td><td>${esc(r.entity_id||'')}</td></tr>`).join('')}</tbody></table></div>`}
};

async function loadBilling(){try{const date=document.getElementById('bdate')?.value||new Date().toISOString().slice(0,10);const d=await api('/api/billing?date='+encodeURIComponent(date));billingBody.innerHTML=`<div class="metrics">${metric('Total sales',money(d.total_sales))}${metric('Cash sales',money(d.cash_sales))}${metric('Capitec card sales',money(d.card_sales))}${metric('EFT sales',money(d.eft_sales))}${metric('Capitec card settled',money(d.capitec_card_net))}${metric('Cash banked',money(d.cash_banked))}${metric('Card outstanding',money(d.unsettled_card))}${metric('Cash available',money(d.cash_available))}</div><div class="grid"><div class="panel"><h3>Record Merchant / Cash Settlement</h3><div class="row"><label>Channel<select id="mchannel"><option value="CAPITEC_CARD">Capitec Card Merchant</option><option value="CAPITEC_EFT">Capitec / EFT</option><option value="CASH_BANKING">Cash Banking / Deposit</option></select></label><label>Gross amount (R)<input id="mgross" type="number" min="0" step="0.01"></label><label>Merchant fees (R)<input id="mfees" type="number" min="0" step="0.01" value="0"></label><label>Net amount (R)<input id="mnet" type="number" min="0" step="0.01" placeholder="Auto gross - fees"></label></div><div class="row" style="margin-top:10px"><label>Reference<input id="mref" placeholder="Capitec settlement / deposit reference"></label><label>Status<select id="mstatus"><option>PENDING</option><option>SETTLED</option><option>RECONCILED</option></select></label><label>Notes<input id="mnotes"></label></div><button class="btn" style="margin-top:12px" onclick="recordSettlement()">Record Settlement</button><div id="merchantMsg" class="msg"></div></div><div class="panel"><h3>Daily Reconciliation</h3>${line('Cash sales',money(d.cash_sales))}${line('Cash expenses',money(d.cash_expenses))}${line('Cash banked',money(d.cash_banked))}${line('Cash still available',money(d.cash_available))}${line('Card sales',money(d.card_sales))}${line('Capitec card net settled',money(d.capitec_card_net))}${line('Card outstanding',money(d.unsettled_card))}${line('EFT sales',money(d.eft_sales))}${line('EFT net settled',money(d.capitec_eft_net))}</div></div><div class="panel table-wrap"><h3>Settlement Register</h3><table><thead><tr><th>Time</th><th>Channel</th><th>Gross</th><th>Fees</th><th>Net</th><th>Reference</th><th>Status</th><th>Actor</th><th class="director-only">Director</th></tr></thead><tbody>${d.settlements.length?d.settlements.map(s=>`<tr><td>${new Date(s.created_at).toLocaleString()}</td><td>${esc(s.channel)}</td><td>${money(s.gross_amount)}</td><td>${money(s.fees)}</td><td>${money(s.net_amount)}</td><td>${esc(s.reference||'')}</td><td>${esc(s.status)}</td><td>${esc(s.actor)}</td><td class="director-only"><button class="btn danger" onclick="removeSettlement(${s.id})">Remove</button></td></tr>`).join(''):'<tr><td colspan="9" class="muted">No settlement or cash banking records for this date yet.</td></tr>'}</tbody></table></div>`}catch(e){billingBody.innerHTML=`<div class="msg bad">${esc(e.message)}</div>`}}
async function recordSettlement(){try{const gross=Number(mgross.value),fees=Number(mfees.value||0),net=mnet.value===''?null:Number(mnet.value);await api('/api/merchant-settlements',{method:'POST',body:JSON.stringify({business_date:bdate.value,channel:mchannel.value,gross_amount:gross,fees,net_amount:net,reference:mref.value,status:mstatus.value,notes:mnotes.value})});flash('merchantMsg','Settlement recorded');await loadBilling()}catch(e){flash('merchantMsg',e.message,false)}}
async function removeSettlement(id){if(!isDirector())return;if(!confirm('Remove this settlement record? The action will remain in the audit trail.'))return;try{await api('/api/merchant-settlements/'+id,{method:'DELETE'});await loadBilling()}catch(e){alert(e.message)}}
function renderProducts(){const cat=catFilter?.value||'',q=(search?.value||'').toLowerCase();const list=catalogue.filter(p=>(!cat||p.category===cat)&&(!q||(p.name+' '+(p.size_label||p.serving)).toLowerCase().includes(q)));products.innerHTML=list.map(p=>`<div class="product"><span class="pill">${esc(p.category)}</span><h4>${esc(p.name)}</h4><div class="stock">${esc(p.size_label||p.serving)} · Stock: ${p.stock_qty}${p.units_per_case>1?' · '+Math.floor(p.stock_qty/p.units_per_case)+' cases':''}</div><div class="price">${money(p.selling_price)}</div><button class="btn secondary" onclick="addCart('${p.sku}','UNIT')" ${p.stock_qty<=0?'disabled':''}>Add Unit</button>${p.units_per_case>1?` <button class="btn secondary" onclick="addCart('${p.sku}','CASE')" ${p.stock_qty<p.units_per_case?'disabled':''}>Add Case ${p.case_price!=null?'('+money(p.case_price)+')':''}</button>`:''}</div>`).join('')}
function addCart(sku,mode){const k=sku+'|'+mode;cart[k]=(cart[k]||0)+1;renderCart()}
function removeCart(k){if(--cart[k]<=0)delete cart[k];renderCart()}
function renderCart(){const c=document.getElementById('cart');if(!c)return;const arr=Object.entries(cart);if(!arr.length){c.innerHTML='<p class="muted">No items added.</p>';return}let total=0;c.innerHTML=arr.map(([k,qty])=>{const [sku,mode]=k.split('|'),p=catalogue.find(x=>x.sku===sku),price=mode==='CASE'?(p.case_price??p.selling_price*p.units_per_case):p.selling_price,t=price*qty;total+=t;return `<div class="cart-line"><span>${esc(p.name)} ${esc(p.size_label||p.serving)} · ${mode} × ${qty}</span><span>${money(t)} <button class="btn secondary" onclick="removeCart('${k}')">−</button></span></div>`}).join('')+`<div class="cart-line"><b>TOTAL</b><b>${money(total)}</b></div>`}
async function completeSale(){try{const items=Object.entries(cart).map(([k,qty])=>{const [sku,mode]=k.split('|');return{sku,mode,qty}});if(!items.length)throw new Error('Add at least one item');const r=await api('/api/sales',{method:'POST',body:JSON.stringify({items,payment_method:pay.value,cash_tendered:pay.value==='CASH'?Number(tender.value):null})});cart={};flash('saleMsg',`Sale complete · ${r.receipt_no} · ${money(r.total)}${r.change_due!=null?' · Change '+money(r.change_due):''}`);await loadCatalogue();renderProducts();renderCart()}catch(e){flash('saleMsg',e.message,false)}}
async function receiveStock(){try{await api('/api/stock/receive',{method:'POST',body:JSON.stringify({sku:rsku.value,mode:rmode.value,qty:Number(rqty.value),unit_cost:Number(rcost.value),reference:rref.value,note:rnote.value})});flash('receiveMsg','Stock received successfully');await loadCatalogue()}catch(e){flash('receiveMsg',e.message,false)}}
async function addProduct(){try{await api('/api/products',{method:'POST',body:JSON.stringify({sku:nsku.value,category:ncat.value,name:nname.value,size_label:nsize.value,selling_price:Number(nprice.value),units_per_case:Number(ncaseunits.value),case_price:ncaseprice.value,reorder_level:Number(nreorder.value),age_restricted:nage.value==='true'})});flash('productMsg','Product/size added');await pages.products()}catch(e){flash('productMsg',e.message,false)}}
async function saveProduct(sku){try{await api('/api/products/'+encodeURIComponent(sku),{method:'PUT',body:JSON.stringify({name:document.getElementById('name-'+sku).value,category:document.getElementById('cat-'+sku).value,size_label:document.getElementById('size-'+sku).value,selling_price:Number(document.getElementById('price-'+sku).value),units_per_case:Number(document.getElementById('uc-'+sku).value),case_price:document.getElementById('cp-'+sku).value,reorder_level:Number(document.getElementById('ro-'+sku).value),age_restricted:document.getElementById('age-'+sku).value==='true',active:document.getElementById('active-'+sku).value==='true'})});alert('Saved');await pages.products()}catch(e){alert(e.message)}}
async function removeProduct(sku){if(!confirm('Remove this item from active sale? Historical sales will be preserved.'))return;try{await api('/api/products/'+encodeURIComponent(sku),{method:'DELETE'});await pages.products()}catch(e){alert(e.message)}}
async function addUser(){try{await api('/api/users',{method:'POST',body:JSON.stringify({email:uemail.value,password:upass.value,role:urole.value})});flash('staffMsg','Staff account created');await pages.staff()}catch(e){flash('staffMsg',e.message,false)}}
async function saveUser(id){try{await api('/api/users/'+id,{method:'PUT',body:JSON.stringify({role:document.getElementById('ur-'+id).value,active:document.getElementById('ua-'+id).value==='true',password:document.getElementById('up-'+id).value})});alert('Staff account updated');await pages.staff()}catch(e){alert(e.message)}}
async function saveExpense(){try{await api('/api/expenses',{method:'POST',body:JSON.stringify({category:ecat.value,description:edesc.value,amount:Number(eamt.value),payment_method:epay.value,reference:eref.value})});flash('expenseMsg','Expense recorded')}catch(e){flash('expenseMsg',e.message,false)}}
async function cashup(){try{const r=await api('/api/cashups',{method:'POST',body:JSON.stringify({business_date:cdate.value,opening_float:Number(cfloat.value),actual_cash:Number(cactual.value),notes:cnotes.value})});flash('cashMsg',`Cash-up saved · Expected ${money(r.cashup.expected_cash)} · Variance ${money(r.cashup.variance)}`)}catch(e){flash('cashMsg',e.message,false)}}
async function saveInfra(){try{await api('/api/infrastructure',{method:'POST',body:JSON.stringify({battery_percent:Number(ibatt.value),solar_kw:Number(isolar.value),water_percent:Number(iwater.value),internet_status:inet.value,note:inote.value})});flash('infraMsg','Infrastructure status updated')}catch(e){flash('infraMsg',e.message,false)}}
(async()=>{if(TOKEN){try{user=await api('/api/me');applyRole();document.getElementById('login').classList.add('hidden');await loadCatalogue();await show('dashboard')}catch(e){localStorage.removeItem('es_token');location.reload()}}})();
</script></body></html>
